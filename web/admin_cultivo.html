<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cultivo · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/cultivo_comun.js" defer></script>
  <script src="/admin_cultivo.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Cultivo</h1>
      <div>
        <a id="nuevo-lote" class="boton oculto" href="/admin_lote_nuevo.html">Empezar un lote</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <div id="cifras" class="cifras"></div>

      <section class="bloque">
        <h2>Lotes en marcha</h2>
        <p class="nota">Tocá un lote para anotar lo que hiciste y ver lo que sigue.</p>
        <div id="lotes" class="mosaico"></div>
        <details id="bloque-cerrados" class="plegable oculto">
          <summary>Lotes cerrados</summary>
          <div id="cerrados" class="mosaico"></div>
        </details>
      </section>

      <section class="bloque">
        <h2>Salas</h2>
        <div id="salas" class="mosaico"></div>
      </section>

      <section class="bloque">
        <h2>Variedades</h2>
        <div id="variedades" class="lista-etiquetas"></div>
      </section>

      <section class="bloque">
        <h2>Cómo rindieron</h2>
        <p class="nota">Se rellena solo cuando un lote llega al peso seco.</p>
        <div id="comparativas" class="mosaico"></div>
      </section>
    </div>
  </main>
</body>
</html>
