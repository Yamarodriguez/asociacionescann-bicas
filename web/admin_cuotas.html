<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cuotas · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_cuotas.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Cuotas</h1>
      <div>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <div id="cifras" class="cifras"></div>
      <section class="bloque">
        <h2>Socios</h2>
        <p class="nota">Solo se anota aquí lo que se pagó en el local o por transferencia.</p>
        <div id="filtro-cuota" class="elecciones filtros"></div>
        <div id="socios" class="mosaico"></div>
      </section>
      <section class="bloque">
        <h2>Últimos pagos</h2>
        <div id="pagos" class="historial"></div>
      </section>
    </div>
  </main>
</body>
</html>
