<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tareas · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_tareas.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Tareas</h1>
      <div>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <div id="cifras" class="cifras"></div>
      <section class="bloque">
        <h2>Qué hay que hacer</h2>
        <div id="vistas" class="elecciones filtros"></div>
        <details class="plegable">
          <summary>Filtrar por persona o sala</summary>
          <div class="rejilla-campos">
            <div class="campo">
              <label for="filtro-persona">Persona</label>
              <select id="filtro-persona"></select>
            </div>
            <div class="campo">
              <label for="filtro-sala">Sala</label>
              <select id="filtro-sala"></select>
            </div>
          </div>
        </details>
        <div id="lista" class="mosaico"></div>
      </section>
    </div>
  </main>
</body>
</html>
