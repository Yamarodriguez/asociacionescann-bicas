<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Auditoría · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/admin_auditoria.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Auditoría</h1>
      <div>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <section class="tarjeta">
      <p class="nota">Últimas 300 acciones. Este registro no se puede modificar.</p>
      <p id="estado-lista" class="cargando">Cargando…</p>
      <table id="tabla" class="oculto">
        <thead>
          <tr>
            <th scope="col">Fecha</th>
            <th scope="col">Responsable</th>
            <th scope="col">Acción</th>
            <th scope="col">Sobre</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
