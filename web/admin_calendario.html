<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Calendario · Prototipo</title>
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/admin_calendario.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina">
    <div class="cabecera">
      <h1>Calendario</h1>
      <div>
        <a class="boton secundario" href="/admin.html">Volver al panel</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>
    <div id="contenido" class="oculto">
      <p class="nota">Próximos 60 días: lo que tu rol puede ver.</p>
      <div id="dias"></div>
    </div>
  </main>

</html>
