<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Socios · Prototipo</title>
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/admin_socios.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Socios</h1>
      <div>
        <a class="boton secundario" href="/admin.html">Volver al panel</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <section class="tarjeta">
      <div class="herramientas">
        <div class="campo">
          <label for="buscar">Buscar por nombre, documento o número</label>
          <input id="buscar" type="search" autocomplete="off">
        </div>
        <a class="boton secundario" href="/api/admin_socios_csv">Descargar CSV</a>
      </div>
      <p id="estado-lista" class="cargando">Cargando…</p>
      <table id="tabla" class="oculto">
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Documento</th>
            <th scope="col">Estado</th>
            <th scope="col">Número</th>
            <th scope="col">Cuota hasta</th>
            <th scope="col">Acción</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
