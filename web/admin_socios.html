<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Socios · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_socios.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Socios</h1>
      <div>
        <a class="boton secundario" href="/api/admin_socios_csv">Descargar la lista</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <div id="cifras" class="cifras"></div>
      <section class="bloque">
        <div class="campo">
          <label for="buscar">Buscar por nombre, documento o número</label>
          <input id="buscar" type="search" autocomplete="off">
        </div>
        <div id="estados" class="elecciones filtros"></div>
        <div id="socios" class="mosaico"></div>
      </section>
    </div>
  </main>
</body>
</html>
