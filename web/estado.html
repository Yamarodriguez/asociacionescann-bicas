<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Estado de la solicitud · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/estado.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina">
    <div class="barra-portal">
      <a class="marca" href="/" data-sitio="nombre">Asociación</a>
      <button type="button" id="salir" class="secundario">Salir</button>
    </div>
    <section class="saludo">
      <div>
        <h1>Tu solicitud</h1>
        <p class="saludo-resumen">Acá podés ver en qué estado está.</p>
      </div>
      <img class="saludo-dibujo saludo-chico" src="/acceso.svg" alt="" width="360" height="260">
    </section>
    <div id="contenido" class="tarjeta" role="status">
      <p class="cargando">Cargando…</p>
    </div>
  </main>
</body>
</html>
