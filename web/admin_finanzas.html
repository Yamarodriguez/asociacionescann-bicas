<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Finanzas · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_finanzas.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Finanzas</h1>
      <div>
        <a class="boton secundario" href="/api/finanzas_csv" download>Bajar movimientos para la contadora</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <div id="cifras" class="cifras"></div>
      <section class="bloque">
        <h2>¿Qué querés anotar?</h2>
        <div id="acciones" class="anotar"></div>
      </section>
      <section class="bloque">
        <h2>Movimientos</h2>
        <div id="movimientos" class="historial"></div>
        <details id="bloque-anteriores" class="plegable oculto">
          <summary>Ver los anteriores</summary>
          <div id="movimientos-anteriores" class="historial"></div>
        </details>
      </section>
      <section class="bloque">
        <h2 id="titulo-presupuesto">Presupuesto</h2>
        <div id="presupuesto" class="mosaico"></div>
      </section>
      <section class="bloque">
        <details class="plegable">
          <summary>Cierres de caja</summary>
          <div id="cierres" class="historial"></div>
        </details>
      </section>
    </div>
  </main>
</body>
</html>
