<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Equipo · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_equipo.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Equipo</h1>
      <div>
        <a class="boton secundario" href="/admin_calendario.html">Calendario</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <section id="fichaje" class="lo-que-sigue bloque"></section>
      <section class="bloque">
        <h2>Próximos turnos</h2>
        <div id="turnos" class="mosaico"></div>
      </section>
      <section class="bloque">
        <div class="titulo-progreso">
          <h2>Notas para el turno siguiente</h2>
          <button type="button" id="nueva-nota" class="secundario">Dejar una nota</button>
        </div>
        <div id="notas" class="historial"></div>
      </section>
      <section class="bloque">
        <h2>Proyectos</h2>
        <div class="tablero">
          <div>
            <h3>Pendiente</h3>
            <div id="columna-pendiente" class="columna"></div>
          </div>
          <div>
            <h3>En curso</h3>
            <div id="columna-en_curso" class="columna"></div>
          </div>
          <div>
            <h3>Hecho</h3>
            <div id="columna-hecho" class="columna"></div>
          </div>
        </div>
      </section>
      <section id="bloque-recurrentes" class="bloque oculto">
        <h2>Tareas que se repiten</h2>
        <div id="recurrentes" class="mosaico"></div>
      </section>
      <section class="bloque">
        <details class="plegable">
          <summary>Últimos fichajes</summary>
          <div id="fichajes" class="historial"></div>
        </details>
      </section>
    </div>
  </main>
</body>
</html>
