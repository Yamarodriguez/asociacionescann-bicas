<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mora · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_mora.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Cuotas atrasadas</h1>
      <div>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <div id="cifras" class="cifras"></div>
      <section class="lo-que-sigue">
        <div>
          <strong id="regla"></strong>
          <p class="nota">El sistema propone y la comisión decide. Los meses se fijan en Configuración y dependen de los estatutos.</p>
        </div>
        <div id="accion" class="lo-que-sigue-boton"></div>
      </section>
      <section class="bloque espaciada">
        <h2>Socios con la cuota atrasada</h2>
        <div id="socios" class="mosaico"></div>
      </section>
    </div>
  </main>
</body>
</html>
