<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Abastecimiento · Prototipo</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/estilos.css">
  <script src="/app.js" defer></script>
  <script src="/armazon.js" defer></script>
  <script src="/gestion.js" defer></script>
  <script src="/recuadros.js" defer></script>
  <script src="/admin_abastecimiento.js" defer></script>
</head>
<body>
  <p class="aviso-prototipo">Prototipo: todos los datos son inventados.</p>
  <main class="pagina pagina-ancha">
    <div class="cabecera">
      <h1>Abastecimiento</h1>
      <div>
        <a class="boton secundario" href="/admin_inventario.html">Inventario</a>
        <button type="button" id="salir" class="secundario">Salir</button>
      </div>
    </div>
    <div id="mensaje" class="mensaje" role="alert"></div>
    <p id="cargando" class="cargando">Cargando…</p>

    <div id="contenido" class="oculto">
      <section class="bloque">
        <h2>¿Qué necesitás pedir?</h2>
        <p id="regla" class="nota"></p>
        <div id="acciones" class="anotar"></div>
      </section>
      <section class="bloque">
        <h2>Pedidos</h2>
        <div id="pedidos" class="mosaico"></div>
      </section>
      <section class="bloque">
        <h2>Proveedores</h2>
        <div id="proveedores" class="mosaico"></div>
      </section>
      <section class="bloque">
        <details class="plegable">
          <summary>Historial de costes</summary>
          <div id="costes" class="historial"></div>
        </details>
      </section>
    </div>
  </main>
</body>
</html>
