# Pantallas en web/ y servidor en netlify/functions/.
# Netlify aplica solo las migraciones de netlify/database/migrations/ al publicar.
[build]
  publish = "web"

[build.environment]
  NPM_FLAGS = "--omit=dev"
  NODE_VERSION = "24"
  # Ajustes de configuracion, no secretos: el escaner no debe frenar el despliegue por ellos.
  SECRETS_SCAN_OMIT_KEYS = "ENTORNO,CORREO_MODO"

[functions]
  node_bundler = "esbuild"
  # Estas librerias se incluyen tal cual: empaquetarlas puede romper sus cargas internas.
  external_node_modules = ["pg", "qrcode", "@netlify/database"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
